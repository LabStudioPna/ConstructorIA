<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstructorIA v0.1 — MVP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #C87D2F;
      --text: #1A1A1A;
      --border: #E5E7EB;
      --surface: #FFF;
      --bg: #F9FAFB;
    }
    [data-theme="dark"] {
      --text: #FFF;
      --border: #333;
      --surface: #1F1F1F;
      --bg: #121212;
    }
    body { font-family: Inter, sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 18px; font-weight: 700; color: var(--primary); }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab { padding: 12px 16px; border: none; background: none; cursor: pointer; color: var(--text); border-bottom: 3px solid transparent; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 16px; }
    .btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🏗️ ConstructorIA v0.1</div>
    <a href="./index.html" class="btn">← Volver</a>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('presupuestos')">💰 Presupuestos</button>
      <button class="tab" onclick="switchTab('chat')">💬 Chat IA</button>
      <button class="tab" onclick="switchTab('calculadora')">🧮 Calculadora</button>
      <button class="tab" onclick="switchTab('pdf')">📥 Exportar</button>
    </div>

    <div id="presupuestos" class="tab-content active">
      <div class="card">
        <h2>Presupuestos</h2>
        <p>Versión v0.1 MVP - Presupuestos básicos en navegador</p>
        <div style="margin-top: 16px;">
          <input type="text" placeholder="Descripción rubro" style="width: 100%; padding: 8px; margin-bottom: 8px;">
          <input type="number" placeholder="Cantidad" style="width: 100%; padding: 8px; margin-bottom: 8px;">
          <input type="number" placeholder="Precio unitario" style="width: 100%; padding: 8px; margin-bottom: 8px;">
          <button class="btn">+ Agregar</button>
        </div>
      </div>
    </div>

    <div id="chat" class="tab-content">
      <div class="card">
        <h2>Chat con IA</h2>
        <p>Conversá con Claude sobre tu presupuesto</p>
        <div style="margin-top: 16px;">
          <textarea placeholder="Escribe tu pregunta..." style="width: 100%; padding: 8px; height: 100px;"></textarea>
          <button class="btn" style="margin-top: 8px;">Enviar</button>
        </div>
      </div>
    </div>

    <div id="calculadora" class="tab-content">
      <div class="card">
        <h2>Calculadora</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
          <input type="number" placeholder="Valor 1">
          <select><option>+</option><option>-</option><option>×</option><option>÷</option></select>
          <input type="number" placeholder="Valor 2">
          <button class="btn">=</button>
        </div>
      </div>
    </div>

    <div id="pdf" class="tab-content">
      <div class="card">
        <h2>Exportar PDF</h2>
        <p>Descarga tu presupuesto como PDF profesional</p>
        <button class="btn" style="margin-top: 16px;">📥 Descargar PDF</button>
      </div>
    </div>
  </div>

  <script>
    function switchTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
