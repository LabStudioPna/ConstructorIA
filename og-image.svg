    <!-- ridge grooves -->
    <line x1="75" y1="60" x2="75" y2="102.19" stroke="#7A4A1A" stroke-width="2.8" stroke-linecap="round" opacity="0.32"/>
    <line x1="56.25" y1="65.625" x2="64.69" y2="102.19" stroke="#7A4A1A" stroke-width="2.8" stroke-linecap="round" opacity="0.32"/>
    <line x1="93.75" y1="65.625" x2="85.31" y2="102.19" stroke="#7A4A1A" stroke-width="2.8" stroke-linecap="round" opacity="0.32"/>
    <!-- AI spark accent -->
    <path d="M104.06 88.13 L108.75 97.5 L118.13 102.19 L108.75 106.88 L104.06 116.25 L99.38 106.88 L90 102.19 L99.38 97.5 Z" fill="#F5C453"/>
