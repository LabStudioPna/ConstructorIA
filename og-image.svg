  <!-- título -->
  <text x="90" y="335" font-family="'Poppins','Segoe UI',sans-serif" font-size="72" font-weight="700" fill="#FBF3E9">Constructor<tspan fill="#E0A45A">IA</tspan></text>

  <!-- tagline -->
